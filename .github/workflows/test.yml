name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate example playbook
        run: python skills/finance-contract-review/scripts/validate_playbook.py skills/finance-contract-review/assets/finance-playbook.example.json
      - name: Verify example terms
        run: python skills/finance-contract-review/scripts/verify_terms.py skills/finance-contract-review/assets/deal-terms.example.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

